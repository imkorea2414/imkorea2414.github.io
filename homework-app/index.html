<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숙제 알림장</title>
<meta name="theme-color" content="#1f4d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="숙제 알림장">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* VOICE: 다정하고 또렷한 학원 알림장, 선생님·학생·부모님이 함께 쓰는 공책
   IDEA: 칠판 머리띠 + 반 이름표 탭 + 줄 공책 + 도장 세 개(학생 했어요 / 부모님 확인 / 선생님 참 잘했어요)
   PICTURE: 숙제 목록 자체. 선생님은 숙제마다 반 학생들의 도장 진행 막대와 학생별 도장 줄을 본다
   COLOUR and TYPE: 칠판 초록 띠, 흰 공책, 도장 빨강, 연필 노랑 / Jua 제목 + Noto Sans KR 본문
   LAYOUT: 칠판 띠(제목·누구인지·요약) → 반 탭 → 숙제 추가 → 필터 → 목록, 600px 아래는 도장이 제목 아래로 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#111513);--ink:light-dark(#1b201d,#eef2ef);--mute:light-dark(#5f6b65,#9aa7a0);
--line:light-dark(#e3e8e5,#262d29);--rule:light-dark(#dfe9f3,#1d2631);--card:light-dark(#ffffff,#171c19);--soft:light-dark(#f2f7f4,#18221d);
--board:#1f4d3a;--board2:#183d2e;--chalk:#f4f7f2;--stamp:light-dark(#d23a2f,#ff6f62);--pencil:#f2c230;--ok:light-dark(#2f7d55,#6fcf97)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,4vw,48px) max(5vw,16px)}
.wrap{max-width:980px;margin:0 auto}
[hidden]{display:none!important}
header{background:var(--board);color:var(--chalk);background-image:radial-gradient(120% 80% at 10% 0%,#2a6149 0,transparent 60%)}
h1{font:400 clamp(34px,6vw,48px)/1.05 Jua,sans-serif;margin:0;text-wrap:balance}
h2{font:400 26px/1.2 Jua,sans-serif;margin:0 0 6px}
.sub{margin:6px 0 0;opacity:.85}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.who b{background:var(--board2);border-radius:999px;padding:8px 16px;font-weight:700}
.linkbtn{font:inherit;font-size:14px;border:0;background:none;color:inherit;opacity:.8;text-decoration:underline;cursor:pointer;min-height:36px;padding:0 6px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:24px}
.sum div{background:rgba(255,255,255,.08);border-radius:14px;padding:12px 16px}
.sum b{display:block;font:400 32px/1.1 Jua,sans-serif;color:var(--pencil)}
.sum span{font-size:14px;opacity:.85}
.note{font-size:14px;color:var(--mute);margin:0 0 12px}
.note.warn{color:var(--stamp)}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
input,select{font:inherit;font-size:16px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.btn{font:inherit;font-weight:700;min-height:44px;padding:0 20px;border:0;border-radius:10px;background:var(--board);color:var(--chalk);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.ghost{font:inherit;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.small{min-height:36px;font-size:14px;padding:0 12px}
.card{padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.onb{max-width:560px;margin:8px auto 0}
.onb .pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.onb .pick button{font:400 24px/1.2 Jua,sans-serif;min-height:96px;border:2px solid var(--line);border-radius:16px;background:var(--soft);color:var(--ink);cursor:pointer}
.onb .pick button small{display:block;font:14px/1.4 "Noto Sans KR",sans-serif;color:var(--mute);margin-top:4px}
.stackf{display:grid;gap:12px;margin-top:16px}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.kids label{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--ink);min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.kids input{min-height:0;width:20px;height:20px;accent-color:var(--board)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 0 16px}
.tabs button{flex:none;font:inherit;font-size:16px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px 12px 4px 4px;background:var(--soft);color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--board);color:var(--chalk);border-color:var(--board);font-weight:700}
.tabs i{font-style:normal;opacity:.65;margin-left:6px;font-size:14px}
.newc{display:flex;gap:8px;flex:none}
.newc input{width:150px}
.subtabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:0 0 16px}
.subtabs button{font:inherit;min-height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;color:var(--mute);cursor:pointer}
.subtabs button[aria-pressed=true]{color:var(--ink);border-color:var(--board);font-weight:700}
.classbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:-4px 0 12px}
.classbar h2{margin:0}
form.addf{display:grid;grid-template-columns:120px minmax(0,1fr) 160px auto;gap:10px;align-items:end;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.photo{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:0 0 12px;padding:14px 16px;border-radius:16px;background:var(--soft);border:2px dashed light-dark(#b9d3c4,#2f4a3c)}
.photo.drag{border-color:var(--board)}
.photo p{margin:0;flex:1 1 220px;font-size:15px;color:var(--mute)}
.photo label.btn{display:inline-flex;align-items:center;gap:8px;color:var(--chalk);font-size:16px;cursor:pointer}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
#review{margin:0 0 16px;padding:16px;border:2px solid var(--board);border-radius:16px;background:var(--card)}
#review .thumb{float:right;width:88px;height:88px;object-fit:cover;border-radius:10px;margin:0 0 8px 12px;border:1px solid var(--line)}
.rv{display:grid;grid-template-columns:28px 110px minmax(0,1fr) 160px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rv input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--board)}
.rvbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;clear:both}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(1turn)}}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px}
.filters button{font:inherit;font-size:15px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters i{font-style:normal;opacity:.6;margin-left:4px}
ul{list-style:none;margin:0;padding:0}
li.hw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:center;padding:16px 4px;border-bottom:2px solid var(--rule)}
li.hw.done .ttl{color:var(--mute)}
li.hw.t{grid-template-columns:minmax(0,1fr)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--mute)}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;font-weight:700;color:#fff}
.ttl{font-size:17px;font-weight:500;margin:4px 0 0;overflow-wrap:anywhere}
.dday{white-space:nowrap;font-weight:700}
.dday.late{color:var(--stamp)}.dday.today{color:#c58a00}
.del{font:inherit;font-size:13px;border:0;background:none;color:var(--mute);cursor:pointer;padding:6px;min-height:32px;text-decoration:underline}
.del.sure{color:var(--stamp);font-weight:700}
.prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.prog div{font-size:13px;color:var(--mute)}
.prog b{color:var(--ink);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar.p span{background:var(--pencil)}.bar.t span{background:var(--stamp)}
.rowact{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.roster{margin-top:12px;border-top:1px dashed var(--line)}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.sr .nm{font-weight:700}
.sr .nm small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.stamps{display:flex;gap:10px}
.st{display:grid;justify-items:center;gap:2px;font:inherit;background:none;border:0;padding:0;color:var(--mute);font-size:12px;cursor:pointer}
.st:disabled{cursor:default}
.st .o{width:58px;height:58px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font:400 14px/1.05 Jua,sans-serif;text-align:center;color:transparent;transition:transform .18s}
.sr .st .o{width:52px;height:52px;font-size:11px}
.st.mine .o{border-color:var(--ink)}
.st.on .o{border:3px double var(--stamp);color:var(--stamp);transform:rotate(-12deg);background:light-dark(rgba(210,58,47,.06),rgba(255,111,98,.08))}
.st.on.s0 .o{border-color:var(--ok);color:var(--ok);background:light-dark(rgba(47,125,85,.07),rgba(111,207,151,.08))}
.st small{font-size:11px;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font:inherit;font-size:14px;font-weight:500;min-height:36px;padding:0 12px;border:1px solid light-dark(#b9d3c4,#2f4a3c);border-radius:999px;background:var(--soft);color:var(--ok);cursor:pointer}
.pfnote{margin:4px 0 0;font-size:13px;color:var(--mute)}
.mem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mem select{min-height:36px;font-size:14px}
.empty{padding:40px 16px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:16px}
.empty b{display:block;font:400 26px/1.2 Jua,sans-serif;color:var(--ink);margin-bottom:6px}
#lb{position:fixed;inset:0;z-index:10;background:rgba(10,16,13,.72);display:grid;place-items:center;padding:16px}
.lbcard{background:var(--card);color:var(--ink);border-radius:18px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px}
.lbhead{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.lbhead h2{font-size:22px;overflow-wrap:anywhere}
#lb-imgs{display:grid;gap:12px}
#lb-imgs img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
@media(max-width:600px){
 form.addf{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}form.addf .w{grid-column:1/-1}
 li.hw{grid-template-columns:minmax(0,1fr)}
 .sum b{font-size:26px}.sum span{font-size:13px}
 .rv{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr)}.rv .t{grid-column:2/-1;grid-row:1}
 .sr{grid-template-columns:minmax(0,1fr)}
 .mem{grid-template-columns:minmax(0,1fr) auto}.mem select{grid-column:1/-1;grid-row:2}
 .onb .pick{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){.st .o,.spin{transition:none;animation:none}}
</style>

<style>
header.band{padding-top:max(clamp(24px,4vw,48px),env(safe-area-inset-top))}
#lb-x{flex:none;white-space:nowrap}
.auth{max-width:460px;margin:8px auto 0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--soft);border-radius:14px;padding:4px;margin:12px 0 4px}
.seg button{font:inherit;min-height:44px;border:0;border-radius:10px;background:none;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--board);color:var(--chalk);font-weight:700}
.pin{letter-spacing:.4em;font-variant-numeric:tabular-nums}
.codechip{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.codechip b{font:700 18px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--ink);background:var(--soft);border:1px dashed light-dark(#b9d3c4,#2f4a3c);border-radius:8px;padding:6px 10px}
.lock{color:var(--stamp);font-size:13px;font-weight:700}
.memact{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:flex-end}
.setcard{margin-top:16px}
.btn.danger{background:var(--stamp);color:#fff}
@media(max-width:760px){form.addf{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}form.addf .w{grid-column:1/-1}}
.badge{font-style:normal;font-size:12px;font-weight:700;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--pencil);color:#3a2c00}
.pendbox{margin:0 0 16px;padding:14px 16px;border-radius:14px;background:light-dark(#fff8e1,#2a2410);border:1px solid light-dark(#f2d98a,#5a4a1a);font-size:15px}
.pendbox>b{display:block;font:400 20px/1.3 Jua,sans-serif;margin-bottom:2px}
.pendbox .mem{border-color:light-dark(#f2d98a,#5a4a1a)}
.own{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--ok);border:1px solid light-dark(#b9d3c4,#2f4a3c)}
.own.t{color:var(--mute);border-color:var(--line)}
textarea{font:inherit;font-size:16px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical;width:100%}
textarea:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
form.addf .full{grid-column:1/-1}
form.addf .sendb{grid-column:1/-1;justify-self:end;min-width:220px}
.dt{margin:6px 0 0;font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid var(--rule);padding-left:10px;color:light-dark(#38423d,#c9d3ce)}
.more{font:inherit;font-size:13px;border:0;background:none;color:var(--ok);cursor:pointer;padding:2px 0 0 13px;min-height:30px;text-decoration:underline}
.notebox{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line);margin:0 0 12px;font-size:16px;line-height:1.6}
.notebox small{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 0}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font:700 15px/1 sans-serif;cursor:pointer}
.sbf{display:grid;gap:4px}
.bulkbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}
.bulk{margin-top:12px;padding:16px;border:2px dashed light-dark(#b9d3c4,#2f4a3c);border-radius:16px;background:var(--soft)}
.bulk h2{font-size:22px}
.bulk .rvbar{align-items:end}
.bulk .rv{border-color:light-dark(#d4e3da,#2a3a31)}
.bulk .rv input:not([type=checkbox]),.bulk .rv select{min-height:40px;font-size:15px}
@media(max-width:600px){form.addf .sendb{justify-self:stretch}}
.gridtools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:0 0 12px}
.gridtools .filters{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.gw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table.grid{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
.grid th,.grid td{padding:8px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap;background:var(--card)}
.grid thead th{position:sticky;top:0;z-index:2;vertical-align:bottom;font-weight:500;background:var(--soft)}
.grid th.nm,.grid td.nm{position:sticky;left:0;z-index:1;text-align:left;padding:8px 12px;min-width:130px;max-width:170px}
.grid thead th.nm{z-index:3}
.grid td.nm b{display:block;overflow:hidden;text-overflow:ellipsis}
.grid td.nm small{font-size:12px;color:var(--mute)}
.grid .hh{display:grid;gap:3px;justify-items:center;width:92px}
.grid .hh .chip{font-size:11px;padding:0 7px}
.grid .hh span.t{display:block;width:92px;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--ink)}
.grid .hh small{font-size:12px;color:var(--mute)}
.grid tfoot td{position:sticky;bottom:0;background:var(--soft);font-weight:700;font-size:13px}
.cell{display:inline-grid;place-items:center;width:40px;height:32px;border-radius:8px;font:700 13px/1 "Noto Sans KR",sans-serif;border:0;padding:0}
button.cell{cursor:pointer}
.c-ok{background:light-dark(#e3f4ea,#16301f);color:var(--ok)}
.c-chk{background:light-dark(#fde8e6,#3a1714);color:var(--stamp)}
.c-late{background:light-dark(#fff1d6,#33280f);color:light-dark(#9a6a00,#f2c230)}
.c-miss{background:light-dark(#f4f4f4,#222826);color:light-dark(#c0392b,#ff8a7d)}
.c-wait{color:var(--mute)}
.rate{display:inline-block;min-width:44px;font-weight:700}
.rate.low{color:var(--stamp)}
.c-na{color:var(--line);font-weight:400}
.whoto{display:grid;gap:8px}
.whoto>span{font-size:13px;color:var(--mute)}
.seg2{display:inline-flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px;justify-self:start}
.seg2 button{font:inherit;font-size:15px;min-height:40px;padding:0 16px;border:0;border-radius:9px;background:none;color:var(--ink);cursor:pointer}
.seg2 button[aria-pressed=true]{background:var(--board);color:var(--chalk);font-weight:700}
.whoto .kids label{font-size:15px}
.whoto .kids label:has(input:checked){border-color:var(--board);background:var(--soft);font-weight:700}
.pickbar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px;color:var(--mute)}
.tg{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:light-dark(#eef3ff,#1a2233);color:light-dark(#2f5fb8,#8fb3ff);border:1px solid light-dark(#cddcf7,#2b3b5c)}
</style>
</head>
<body>
<header class="band">
 <div class="wrap">
  <div class="top">
   <div><h1>숙제 알림장</h1><p class="sub" id="today"></p></div>
   <div class="who" id="who"></div>
  </div>
  <div class="sum" id="sum" hidden></div>
 </div>
</header>

<main class="band">
 <div class="wrap">
  <p class="note" id="status">불러오는 중…</p>
  <div id="view"></div>
  <input id="f-proof" type="file" accept="image/*" multiple hidden>

const SUBJ_WORDS=[["국어",/국어|받아쓰기|독서록|일기/],["수학",/수학|연산|익힘/],["영어",/영어|단어|english/i],["과학",/과학|실험/],["사회",/사회|도덕|역사/],["예체능",/예체능|체육|음악|미술|리코더|줄넘기/]];
const WD="일월화수목금토";
function guessDue(t,base){
 const today=new Date(ymd(base)+"T00:00:00"),add=n=>ymd(new Date(today.getTime()+n*86400000));
 let m=t.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/)||t.match(/(?:^|[^\d.\/~-])(\d{1,2})\s*[\/.]\s*(\d{1,2})(?![\d.\/])/);
 if(m){const mo=+m[1],d=+m[2];if(mo>=1&&mo<=12&&d>=1&&d<=31){let y=today.getFullYear();let dt=new Date(y,mo-1,d);if(dt<today-30*86400000)dt=new Date(y+1,mo-1,d);return ymd(dt)}}
 if(/모레/.test(t))return add(2);
 if(/내일/.test(t))return add(1);
 if(/오늘/.test(t))return add(0);
 m=t.match(/(다음\s*주\s*)?([일월화수목금토])요일/);
 if(m){const w=WD.indexOf(m[2]),cur=today.getDay();
  if(m[1]){const toMon=((8-cur)%7)||7;return add(toMon+((w+6)%7))}
  let n=(w-cur+7)%7;if(n===0)n=7;return add(n)}
 return "";
}
function parseBulk(text,defSub,defDue){
 const out=[];
 for(let line of String(text||"").replace(/\r/g,"").split("\n")){
  line=line.replace(/^\s*(?:[-*•·▪◦‣○●□■☐✓✔▶►]|\d{1,2}\s*[.)]|[①-⑳]|\(\d{1,2}\))\s*/,"").replace(/\s+/g," ").trim();
  if(line.length<2)continue;
  let subj="";const head=line.match(/^\[?(국어|수학|영어|과학|사회|예체능|체육|음악|미술|도덕)\]?\s*[:)\]·\-]\s*/);
  if(head){subj=/체육|음악|미술/.test(head[1])?"예체능":head[1]==="도덕"?"사회":head[1];line=line.slice(head[0].length).trim()||line}
  if(!subj)subj=(SUBJ_WORDS.find(([,re])=>re.test(line))||[defSub])[0];

function stamps(h,sid,c,who){

  return `<button type="button" class="st s${i}${o?" on":""}${mine?" mine":""}" data-act="stamp" data-h="${esc(h.id)}" data-s="${esc(sid)}" data-k="${k}" ${can?"":"disabled"} aria-pressed="${o}" aria-label="${l} ${word}${!o&&mine&&k==="student"?" (눌러서 제출)":""}">

// ---------- 학생 사진 제출 ----------
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};i.src=u})}
async function shrink(file,steps=[[1280,.72],[1080,.62],[900,.55],[720,.5]],limit=280000){
 const img=await loadImg(file);
 for(const [side,q] of steps){
  const r=Math.min(1,side/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
  c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  const d=c.toDataURL("image/jpeg",q);if(d.length<limit)return d;
 }
 throw new Error("big");
}

function drawThumbs(){

 sub.files.forEach((f,i)=>{const fg=document.createElement("figure"),im=new Image(),x=document.createElement("button");im.src=f.url;im.alt=`고른 사진 ${i+1}`;x.type="button";x.textContent="×";x.dataset.sb="rm";x.dataset.i=i;x.setAttribute("aria-label",`사진 ${i+1} 빼기`);fg.append(im,x);t.append(fg)});

async function sendSubmit(){
 if(!sub)return;const note=($("sb-note")?.value||"").trim(),files=sub.files.map(f=>f.file),hid=sub.hid,msg=$("sb-msg");
 if(!note&&!files.length){msg.className="note warn";msg.textContent=MSG.EMPTY;return}
 const go=lb.querySelector("[data-sb=go]");go.disabled=true;msg.className="note";msg.innerHTML=`<span class="spin"></span>제출하는 중…`;
 try{
  const imgs=[];for(const f of files)imgs.push(await shrink(f));
  await rpc("submit_homework",{p_token:token,p_hw:hid,p_imgs:imgs,p_note:note||null});
  closeLb();status(`${files.length&&note?"글과 사진으로":files.length?"사진으로":"글로"} 숙제를 내고 ‘했어요’ 도장을 찍었어요.`);await refresh(true);
 }catch(err){
  go.disabled=false;msg.className="note warn";
  msg.textContent=err?.message==="img"?"열 수 없는 사진이 있어요. JPG나 PNG로 다시 골라 주세요.":err?.message==="big"?"사진이 너무 커요. 조금 작게 찍어서 다시 골라 주세요.":err?.code==="NET"?"인터넷 연결을 확인해 주세요.":msgOf(err?.code);
 }
}
$("f-proof").addEventListener("change",e=>{

});

 if(a==="bkclose"){bulkOpen=false;bulk=[];render();return}
 if(a==="bkclear"){bulk=[];render();return}
 if(a==="bkparse"){const src=$("bk-src")?.value||"";bulk=parseBulk(src,"기타",$("bk-due")?.value||ymd(new Date(Date.now()+86400000)));
  if(!bulk.length)status("나눌 줄이 없어요. 숙제 글을 붙여넣어 주세요.",true);else status(`${bulk.length}줄로 나눴어요. 과목과 마감일을 확인하고 필요 없는 줄은 체크를 풀어 주세요.`);if(bulk.length>30)bulk.slice(30).forEach(x=>x.on=false);render();return}
 if(a==="bksend"){const tg=assignMode==="pick"?[...picked]:null;if(tg&&!tg.length){status("숙제를 받을 학생을 골라 주세요.",true);return}
  const items=bulk.filter(x=>x.on&&x.title.trim()).map(x=>({subject:x.subject,title:x.title.trim(),due:x.due||null,...(tg?{targets:tg}:{})}));if(!items.length)return;b.disabled=true;
  act("add_homework_many",{p_class:curClass,p_items:items},n=>`숙제 ${n}개를 한꺼번에 냈어요.`).then(()=>{bulk=[];bulkOpen=false;render()}).catch(()=>{});return}
 if(a==="kid"){kid=v;render();return}
 if(a==="toggle"){open.has(v)?open.delete(v):open.add(v);render();return}
 if(a==="photos"){openPhotos(b.dataset.h,b.dataset.s);return}
 if(a==="copy"){try{await navigator.clipboard.writeText(v);status(`가입 코드 ${v}를 복사했어요.`)}catch(err){status(`가입 코드: ${v}`)}return}
 if(a==="rename"){const c=classOf(curClass);const bar=b.closest(".classbar");
  bar.innerHTML=`<form class="newc" id="ren"><input id="ren-in" maxlength="20" required aria-label="반 이름"><button class="btn small" type="submit">저장</button><button class="ghost small" type="button" data-act="ttab" data-v="${teacherTab}">취소</button></form>`;
  $("ren-in").value=c?.name||"";$("ren-in").focus();return}
 if(a==="delclass"){if(armed!=="class")return arm("class");armed=null;act("delete_class",{p_id:curClass},"반을 지웠어요.").then(()=>{curClass=""}).catch(()=>{});return}
 if(a==="delhw"){if(armed!==v)return arm(v);armed=null;act("delete_homework",{p_id:v},"숙제를 지웠어요.").catch(()=>{});return}
 if(a==="delmy"){if(armed!==v)return arm(v);armed=null;act("student_delete_homework",{p_id:v},"숙제를 지웠어요.").catch(()=>{});return}
 if(a==="delstu"){if(armed!=="m"+v)return arm("m"+v);armed=null;act("remove_student",{p_student:v},"명단에서 뺐어요.").catch(()=>{});return}
 if(a==="resetpin"){const w=b.dataset.w;if(armed!=="r"+w+v){armed="r"+w+v;b.textContent="정말 초기화할까요?";b.classList.add("sure");setTimeout(()=>{if(armed==="r"+w+v){armed=null;render()}},4000);return}
  armed=null;act("reset_pin",{p_student:v,p_which:w},`${stuName(v)} ${w==="parent"?"부모님":"학생"} PIN을 초기화했어요. 다음에 들어올 때 새 PIN을 정하면 돼요.`).catch(()=>{});return}
 if(a==="checkall"){b.disabled=true;act("teacher_stamp_all",{p_hw:v},n=>`${n}명 검사 도장을 찍었어요.`).catch(()=>{});return}
 if(a==="stamp"){
  const hid=b.dataset.h,sid=b.dataset.s,k=b.dataset.k,key=hid+"__"+sid;if(busy.has(key)||uploading.has(key))return;
  const c=ck(hid,sid),o=on(c,k);
  if(k==="student"&&!o){openSubmit(hid);return}
  busy.add(key);
  try{
   if(k==="student")await act("unsubmit_homework",{p_hw:hid},"제출을 취소했어요.");
   if(k==="parent")await act("parent_stamp",{p_hw:hid,p_student:sid,p_on:!o});
   if(k==="teacher")await act("teacher_stamp",{p_hw:hid,p_student:sid,p_on:!o});
  }catch(err){}
  busy.delete(key);
 }
});
function syncBulk(t){const i=t.dataset?.bk;if(i==null||!bulk[+i])return false;bulk[+i][t.dataset.f]=t.type==="checkbox"?t.checked:t.value;return true}
view.addEventListener("input",e=>{syncBulk(e.target)});
view.addEventListener("change",e=>{
 const t=e.target;
 if(syncBulk(t)){if(t.type==="checkbox")render();return}
 if(t.dataset.act==="pick"){t.checked?picked.add(t.dataset.v):picked.delete(t.dataset.v);render();return}
 if(t.id==="clean-days"){cleanDays=t.value;armed=null;render();return}
 if(t.dataset.act==="move")act("move_student",{p_student:t.dataset.v,p_class:t.value},`${stuName(t.dataset.v)} 학생을 ${className(t.value)}(으)로 옮겼어요.`).catch(()=>{});
});
view.addEventListener("submit",async e=>{
 e.preventDefault();const f=e.target,val=id=>($(id)?.value||"").trim();
 const btn=f.querySelector("button[type=submit]");if(btn)btn.disabled=true;
 try{
  if(f.id==="f-setup"){const r=await rpc("teacher_setup",{p_name:val("a-tname"),p_pw:$("a-tpw").value}).catch(err=>{fail(err);return null});if(r){hasTeacher=true;token=r.token;ls.set("hw-token",token);await refresh()}}
  if(f.id==="f-tsignup"){if($("a-tpw").value!==$("a-tpw2").value){status("비밀번호가 서로 달라요. 다시 확인해 주세요.",true)}else{try{await rpc("teacher_signup",{p_name:val("a-tname"),p_pw:$("a-tpw").value});tSignup=false;pendingNote="가입 신청을 보냈어요! 이미 쓰고 있는 선생님이 ‘설정’에서 승인하면 같은 이름과 비밀번호로 로그인할 수 있어요.";status("");render()}catch(err){fail(err)}}}
  if(f.id==="f-teacher")await login("teacher_login",{p_name:val("a-tname"),p_pw:$("a-tpw").value});
  if(f.id==="f-student")await login("student_login",{p_code:val("a-code"),p_name:val("a-name"),p_pin:val("a-pin")});
  if(f.id==="f-parent")await login("parent_login",{p_code:val("a-code"),p_child:val("a-name"),p_pin:val("a-pin")});
  if(f.id==="f-addkid")await login("parent_login",{p_code:val("a-code"),p_child:val("a-name"),p_pin:val("a-pin"),p_token:token});
  if(f.id==="newc"){const name=val("c-name");if(name){$("c-name").value="";const r=await act("create_class",{p_name:name},r=>`반을 만들었어요. 가입 코드는 ${r.code}예요.`).catch(()=>null);if(r){curClass=r.id;ls.set("hw-class",r.id);teacherTab="hw";render()}}}
  if(f.id==="ren"){await act("rename_class",{p_id:curClass,p_name:val("ren-in")},"반 이름을 바꿨어요.").catch(()=>{})}
  if(f.id==="add"){const title=val("f-title"),tg=assignMode==="pick"?[...picked]:null;if(tg&&!tg.length){status("숙제를 받을 학생을 골라 주세요.",true)}else if(title){await act("assign_homework",{p_class:curClass,p_subject:$("f-sub").value,p_title:title,p_due:$("f-due").value,p_detail:val("f-detail")||null,p_targets:tg},tg?`고른 ${tg.length}명에게 숙제를 냈어요.`:"반 전체에 숙제를 냈어요.").then(()=>{$("f-title").value="";$("f-detail").value="";$("f-title").focus()}).catch(()=>{})}}
  if(f.id==="myhw"){const title=val("m-title");if(title){await act("student_add_homework",{p_subject:$("m-sub").value,p_title:title,p_due:$("m-due").value},"숙제를 등록했어요. 다 하면 ‘했어요’ 칸을 눌러 글이나 사진으로 제출해요.").then(()=>{$("m-title").value="";$("m-title").focus()}).catch(()=>{})}}
  if(f.id==="f-addteacher"){const r=await act("add_teacher",{p_name:val("s-tname"),p_pw:$("s-tpw").value}).catch(()=>null);if(r){$("s-tname").value="";$("s-tpw").value="";status("선생님을 추가했어요. 이름과 비밀번호를 그 선생님께 알려 주세요.")}}
 }finally{if(btn&&document.contains(btn))btn.disabled=false}
});

// ---------- 시작 ----------
(async()=>{
 if(token)await refresh();
 else{try{hasTeacher=!!(await rpc("app_state"))?.has_teacher}catch(e){}status(hasTeacher?"반 코드나 계정으로 들어와 주세요.":"처음 설정을 해 주세요.");render()}
 setInterval(()=>{if(token&&document.visibilityState==="visible"&&lb.hidden)refresh(true)},20000);
 document.addEventListener("visibilitychange",()=>{if(token&&document.visibilityState==="visible")refresh(true)});
})();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
