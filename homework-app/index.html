<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숙제 알림장</title>
<meta name="theme-color" content="#1f4d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="숙제 알림장">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* VOICE: 다정하고 또렷한 학원 알림장, 선생님·학생·부모님이 함께 쓰는 공책
   IDEA: 칠판 머리띠 + 반 이름표 탭 + 줄 공책 + 도장 세 개(학생 했어요 / 부모님 확인 / 선생님 참 잘했어요)
   PICTURE: 숙제 목록 자체. 선생님은 숙제마다 반 학생들의 도장 진행 막대와 학생별 도장 줄을 본다
   COLOUR and TYPE: 칠판 초록 띠, 흰 공책, 도장 빨강, 연필 노랑 / Jua 제목 + Noto Sans KR 본문
   LAYOUT: 칠판 띠(제목·누구인지·요약) → 반 탭 → 숙제 추가 → 필터 → 목록, 600px 아래는 도장이 제목 아래로 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#111513);--ink:light-dark(#1b201d,#eef2ef);--mute:light-dark(#5f6b65,#9aa7a0);
--line:light-dark(#e3e8e5,#262d29);--rule:light-dark(#dfe9f3,#1d2631);--card:light-dark(#ffffff,#171c19);--soft:light-dark(#f2f7f4,#18221d);
--board:#1f4d3a;--board2:#183d2e;--chalk:#f4f7f2;--stamp:light-dark(#d23a2f,#ff6f62);--pencil:#f2c230;--ok:light-dark(#2f7d55,#6fcf97)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,4vw,48px) max(5vw,16px)}
.wrap{max-width:980px;margin:0 auto}
[hidden]{display:none!important}
header{background:var(--board);color:var(--chalk);background-image:radial-gradient(120% 80% at 10% 0%,#2a6149 0,transparent 60%)}
h1{font:400 clamp(34px,6vw,48px)/1.05 Jua,sans-serif;margin:0;text-wrap:balance}
h2{font:400 26px/1.2 Jua,sans-serif;margin:0 0 6px}
.sub{margin:6px 0 0;opacity:.85}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.who b{background:var(--board2);border-radius:999px;padding:8px 16px;font-weight:700}
.linkbtn{font:inherit;font-size:14px;border:0;background:none;color:inherit;opacity:.8;text-decoration:underline;cursor:pointer;min-height:36px;padding:0 6px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:24px}
.sum div{background:rgba(255,255,255,.08);border-radius:14px;padding:12px 16px}
.sum b{display:block;font:400 32px/1.1 Jua,sans-serif;color:var(--pencil)}
.sum span{font-size:14px;opacity:.85}
.note{font-size:14px;color:var(--mute);margin:0 0 12px}
.note.warn{color:var(--stamp)}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
input,select{font:inherit;font-size:16px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.btn{font:inherit;font-weight:700;min-height:44px;padding:0 20px;border:0;border-radius:10px;background:var(--board);color:var(--chalk);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.ghost{font:inherit;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.small{min-height:36px;font-size:14px;padding:0 12px}
.card{padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.onb{max-width:560px;margin:8px auto 0}
.onb .pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.onb .pick button{font:400 24px/1.2 Jua,sans-serif;min-height:96px;border:2px solid var(--line);border-radius:16px;background:var(--soft);color:var(--ink);cursor:pointer}
.onb .pick button small{display:block;font:14px/1.4 "Noto Sans KR",sans-serif;color:var(--mute);margin-top:4px}
.stackf{display:grid;gap:12px;margin-top:16px}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.kids label{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--ink);min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.kids input{min-height:0;width:20px;height:20px;accent-color:var(--board)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 0 16px}
.tabs button{flex:none;font:inherit;font-size:16px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px 12px 4px 4px;background:var(--soft);color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--board);color:var(--chalk);border-color:var(--board);font-weight:700}
.tabs i{font-style:normal;opacity:.65;margin-left:6px;font-size:14px}
.newc{display:flex;gap:8px;flex:none}
.newc input{width:150px}
.subtabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:0 0 16px}
.subtabs button{font:inherit;min-height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;color:var(--mute);cursor:pointer}
.subtabs button[aria-pressed=true]{color:var(--ink);border-color:var(--board);font-weight:700}
.classbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:-4px 0 12px}
.classbar h2{margin:0}
form.addf{display:grid;grid-template-columns:120px minmax(0,1fr) 160px auto;gap:10px;align-items:end;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.photo{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:0 0 12px;padding:14px 16px;border-radius:16px;background:var(--soft);border:2px dashed light-dark(#b9d3c4,#2f4a3c)}
.photo.drag{border-color:var(--board)}
.photo p{margin:0;flex:1 1 220px;font-size:15px;color:var(--mute)}
.photo label.btn{display:inline-flex;align-items:center;gap:8px;color:var(--chalk);font-size:16px;cursor:pointer}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
#review{margin:0 0 16px;padding:16px;border:2px solid var(--board);border-radius:16px;background:var(--card)}
#review .thumb{float:right;width:88px;height:88px;object-fit:cover;border-radius:10px;margin:0 0 8px 12px;border:1px solid var(--line)}
.rv{display:grid;grid-template-columns:28px 110px minmax(0,1fr) 160px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rv input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--board)}
.rvbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;clear:both}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(1turn)}}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px}
.filters button{font:inherit;font-size:15px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters i{font-style:normal;opacity:.6;margin-left:4px}
ul{list-style:none;margin:0;padding:0}
li.hw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:center;padding:16px 4px;border-bottom:2px solid var(--rule)}
li.hw.done .ttl{color:var(--mute)}
li.hw.t{grid-template-columns:minmax(0,1fr)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--mute)}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;font-weight:700;color:#fff}
.ttl{font-size:17px;font-weight:500;margin:4px 0 0;overflow-wrap:anywhere}
.dday{white-space:nowrap;font-weight:700}
.dday.late{color:var(--stamp)}.dday.today{color:#c58a00}
.del{font:inherit;font-size:13px;border:0;background:none;color:var(--mute);cursor:pointer;padding:6px;min-height:32px;text-decoration:underline}
.del.sure{color:var(--stamp);font-weight:700}
.prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.prog div{font-size:13px;color:var(--mute)}
.prog b{color:var(--ink);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar.p span{background:var(--pencil)}.bar.t span{background:var(--stamp)}
.rowact{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.roster{margin-top:12px;border-top:1px dashed var(--line)}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.sr .nm{font-weight:700}
.sr .nm small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.stamps{display:flex;gap:10px}
.st{display:grid;justify-items:center;gap:2px;font:inherit;background:none;border:0;padding:0;color:var(--mute);font-size:12px;cursor:pointer}
.st:disabled{cursor:default}
.st .o{width:58px;height:58px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font:400 14px/1.05 Jua,sans-serif;text-align:center;color:transparent;transition:transform .18s}
.sr .st .o{width:52px;height:52px;font-size:11px}
.st.mine .o{border-color:var(--ink)}
.st.on .o{border:3px double var(--stamp);color:var(--stamp);transform:rotate(-12deg);background:light-dark(rgba(210,58,47,.06),rgba(255,111,98,.08))}
.st.on.s0 .o{border-color:var(--ok);color:var(--ok);background:light-dark(rgba(47,125,85,.07),rgba(111,207,151,.08))}
.st small{font-size:11px;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font:inherit;font-size:14px;font-weight:500;min-height:36px;padding:0 12px;border:1px solid light-dark(#b9d3c4,#2f4a3c);border-radius:999px;background:var(--soft);color:var(--ok);cursor:pointer}
.pfnote{margin:4px 0 0;font-size:13px;color:var(--mute)}
.mem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mem select{min-height:36px;font-size:14px}
.empty{padding:40px 16px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:16px}
.empty b{display:block;font:400 26px/1.2 Jua,sans-serif;color:var(--ink);margin-bottom:6px}
#lb{position:fixed;inset:0;z-index:10;background:rgba(10,16,13,.72);display:grid;place-items:center;padding:16px}
.lbcard{background:var(--card);color:var(--ink);border-radius:18px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px}
.lbhead{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.lbhead h2{font-size:22px;overflow-wrap:anywhere}
#lb-imgs{display:grid;gap:12px}
#lb-imgs img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
@media(max-width:600px){
 form.addf{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}form.addf .w{grid-column:1/-1}
 li.hw{grid-template-columns:minmax(0,1fr)}
 .sum b{font-size:26px}.sum span{font-size:13px}
 .rv{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr)}.rv .t{grid-column:2/-1;grid-row:1}
 .sr{grid-template-columns:minmax(0,1fr)}
 .mem{grid-template-columns:minmax(0,1fr) auto}.mem select{grid-column:1/-1;grid-row:2}
 .onb .pick{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){.st .o,.spin{transition:none;animation:none}}
</style>

<style>
header.band{padding-top:max(clamp(24px,4vw,48px),env(safe-area-inset-top))}
#lb-x{flex:none;white-space:nowrap}
.auth{max-width:460px;margin:8px auto 0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--soft);border-radius:14px;padding:4px;margin:12px 0 4px}
.seg button{font:inherit;min-height:44px;border:0;border-radius:10px;background:none;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--board);color:var(--chalk);font-weight:700}
.pin{letter-spacing:.4em;font-variant-numeric:tabular-nums}
.codechip{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.codechip b{font:700 18px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--ink);background:var(--soft);border:1px dashed light-dark(#b9d3c4,#2f4a3c);border-radius:8px;padding:6px 10px}
.lock{color:var(--stamp);font-size:13px;font-weight:700}
.memact{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:flex-end}
.setcard{margin-top:16px}
.btn.danger{background:var(--stamp);color:#fff}
@media(max-width:760px){form.addf{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}form.addf .w{grid-column:1/-1}}
.badge{font-style:normal;font-size:12px;font-weight:700;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--pencil);color:#3a2c00}
.pendbox{margin:0 0 16px;padding:14px 16px;border-radius:14px;background:light-dark(#fff8e1,#2a2410);border:1px solid light-dark(#f2d98a,#5a4a1a);font-size:15px}
.pendbox>b{display:block;font:400 20px/1.3 Jua,sans-serif;margin-bottom:2px}
.pendbox .mem{border-color:light-dark(#f2d98a,#5a4a1a)}
.own{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--ok);border:1px solid light-dark(#b9d3c4,#2f4a3c)}
.own.t{color:var(--mute);border-color:var(--line)}
</style>
</head>
<body>
<header class="band">
 <div class="wrap">
  <div class="top">
   <div><h1>숙제 알림장</h1><p class="sub" id="today"></p></div>
   <div class="who" id="who"></div>
  </div>
  <div class="sum" id="sum" hidden></div>
 </div>
</header>

<main class="band">
 <div class="wrap">
  <p class="note" id="status">불러오는 중…</p>
  <div id="view"></div>
  <input id="f-proof" type="file" accept="image/*" multiple hidden>
 </div>
</main>

<div id="lb" hidden role="dialog" aria-modal="true" aria-labelledby="lb-t">
 <div class="lbcard">
  <div class="lbhead"><div><h2 id="lb-t"></h2><p class="note" id="lb-s"></p></div><button type="button" class="ghost" id="lb-x">닫기</button></div>
  <div id="lb-imgs"></div>
 </div>
</div>

<script>
{
// ---------- 설정 ----------
const API_URL="https://iiyaxrwlfuodlahreipj.supabase.co";
const API_KEY="sb_publishable_kg0crrsETsOR-ga_Iikdqw_ikWngdUR";

const SUBJECTS=[["국어","#d9534f"],["수학","#2f6fd6"],["영어","#8a4fd1"],["과학","#1f9d73"],["사회","#d98a1f"],["예체능","#c2479a"],["기타","#6b7a73"]];
const STAGES=[["student","학생","했어요"],["parent","부모님","확인"],["teacher","선생님","참 잘했어요"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const CAM='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const PIC='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></svg>';
$("today").textContent=new Date().toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"});

// ---------- 서버 ----------
const MSG={AUTH:"로그인이 끝났어요. 다시 로그인해 주세요.",FORBIDDEN:"이 작업을 할 권한이 없어요.",NOT_FOUND:"찾을 수 없어요. 새로고침해 주세요.",
 NOT_EMPTY:"학생이 있는 반은 지울 수 없어요. 먼저 학생을 옮기거나 빼 주세요.",TAKEN:"옮길 반에 같은 이름의 학생이 이미 있어요.",NOT_SUBMITTED:"아이가 사진을 올린 뒤에 확인할 수 있어요.",
 PHOTO_BAD:"사진을 저장하지 못했어요. 다시 찍어 올려 주세요.",PHOTO_COUNT:"사진은 1~3장 올릴 수 있어요.",NAME:"이름을 적어 주세요.",TITLE:"숙제 내용을 적어 주세요.",
 BAD_LOGIN:"이름이나 비밀번호가 맞지 않아요.",BAD_PIN:"PIN이 맞지 않아요.",LOCKED:"여러 번 틀려서 15분 동안 잠겼어요. 잠시 후 다시 해 주세요.",NO_CLASS:"반 코드를 찾을 수 없어요. 선생님께 받은 코드를 확인해 주세요.",
 NO_CHILD:"이 반에 그 이름의 학생이 없어요. 아이가 먼저 학생으로 등록해야 해요.",PIN_FORMAT:"PIN은 숫자 4자리예요.",PW_SHORT:"비밀번호는 6자 이상으로 정해 주세요.",ALREADY:"이미 선생님 계정이 있어요. 로그인해 주세요.",TOO_MANY:"개수가 너무 많아요. 정리한 뒤 다시 해 주세요.",PENDING:"아직 승인을 기다리고 있어요. 승인되면 같은 정보로 들어올 수 있어요.",CHILD_PENDING:"아이가 아직 선생님 승인을 기다리고 있어요. 승인된 뒤에 연결할 수 있어요.",TAKEN_NAME:"같은 이름의 선생님이 이미 있어요. 이름 뒤에 글자를 붙여 주세요.",CHECKED:"선생님이 검사한 숙제는 지울 수 없어요."};
const msgOf=c=>MSG[c]||"잠시 문제가 생겼어요. 다시 해 주세요.";
async function rpc(fn,args={}){
 let r;
 try{r=await fetch(`${API_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:API_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)})}
 catch(e){throw{code:"NET"}}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){const code=String(j?.message||"").trim();if(code==="AUTH")logoutLocal();throw{code:MSG[code]?code:"SERVER"}}
 if(j&&typeof j==="object"&&!Array.isArray(j)&&j.error)throw{code:j.error};
 return j;

function status(t,w){$("status").textContent=t;$("status").className="note"+(w?" warn":"")}

async function refresh(quiet){

 if(loading)return;loading=true;
 try{D=await rpc("get_data",{p_token:token});checks={};for(const c of D.checks)checks[c.hw_id+"__"+c.student_id]=c;if(!quiet)status(hint())}
 catch(e){if(e.code!=="AUTH"&&!quiet)fail(e)}

}
function hint(){const r=D?.role;return r==="teacher"?"반을 고르고 숙제를 내세요. 반 코드를 학생·부모님에게 알려 주면 가입할 수 있어요.":r==="student"?"받은 숙제를 직접 등록하고, 다 하면 사진을 찍어 ‘했어요’ 칸을 눌러 올려요.":r==="parent"?"아이가 사진을 올린 숙제에 ‘확인’ 도장을 찍어 주세요.":""}
async function act(fn,args,ok){try{const r=await rpc(fn,{p_token:token,...args});if(ok)status(typeof ok==="function"?ok(r):ok);await refresh(true);return r}catch(e){fail(e);await refresh(true);throw e}}

 if(!due)return["",""];

}

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};i.src=u})}
async function shrink(file,steps=[[1280,.72],[1080,.62],[900,.55],[720,.5]],limit=280000){
 const img=await loadImg(file);
 for(const [side,q] of steps){
  const r=Math.min(1,side/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
  c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  const d=c.toDataURL("image/jpeg",q);if(d.length<limit)return d;
 }
 throw new Error("big");
}
let proofFor=null;
async function submitProof(hid,files){
 files=[...files].filter(f=>/^image\//.test(f.type)).slice(0,3);if(!files.length)return;
 const key=hid+"__"+D.me.id;uploading.add(key);render();
 try{const imgs=[];for(const f of files)imgs.push(await shrink(f));await act("submit_homework",{p_hw:hid,p_imgs:imgs},"숙제 사진을 올리고 ‘했어요’ 도장을 찍었어요.")}
 catch(err){if(err?.message==="img")status("이 사진은 열 수 없어요. JPG나 PNG로 다시 올려 주세요.",true);else if(err?.message==="big")status("사진이 너무 커요. 조금 작게 찍어서 다시 올려 주세요.",true)}
 uploading.delete(key);render();
}
$("f-proof").addEventListener("change",e=>{const f=e.target.files,id=proofFor;proofFor=null;if(id&&f?.length)submitProof(id,f);e.target.value=""});
