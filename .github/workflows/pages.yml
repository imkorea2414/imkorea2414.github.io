name: Deploy Pages (service files only)

# 웹 앱 서비스에 필요한 파일만 Pages에 배포한다 (2026-11-19부터 fonts/ 포함: 글꼴을 직접 제공). 개발 문서(docs, CLAUDE.md, src, tests, tools, android)는 배포하지 않는다.
# 2026-11-19: Settings → Pages → Source = "GitHub Actions". 첫 수동 배포·실제 사이트 검사 통과 뒤 main push 자동 배포를 켰다.
# 되돌리기: Source를 "Deploy from a branch" → main / (root)로 바꾸면 예전 방식(저장소 전체 공개)으로 바로 돌아간다.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect service files
        run: |
          set -euo pipefail
          # 필요한 파일 (index.html·sw.js·manifest·TWA 설정에서 참조하는 것 전부)
          FILES="index.html privacy.html manifest.webmanifest sw.js
                 icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png icons/maskable-512.png
                 .well-known/assetlinks.json"
          rm -rf _site
          for f in $FILES; do mkdir -p "_site/$(dirname "$f")"; cp "$f" "_site/$f"; done
          # 글꼴 (woff2 + fonts.css + OFL 라이선스)
          cp -r fonts "_site/fonts"
          # TWA 연결 파일이 원본과 똑같이 들어갔는지 확인 (빠지면 안드로이드 앱 위에 주소창이 생긴다)
          cmp .well-known/assetlinks.json _site/.well-known/assetlinks.json
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # 기본값은 점(.)으로 시작하는 폴더를 빼므로 .well-known을 넣으려면 반드시 true
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Quick check (TWA link file)
        run: |
          set -euo pipefail
          sleep 20
          curl -fsS "https://imkorea2414.github.io/.well-known/assetlinks.json" -o served.json
          python3 -c "import json,sys; a=json.load(open('served.json')); b=json.load(open('.well-known/assetlinks.json')); sys.exit(0 if a==b else 'assetlinks.json differs')"

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify live site (files, privacy, offline, assetlinks, removed files)
        run: python3 tools/verify_live.py https://imkorea2414.github.io/
