name: Deploy Pages (service files only)

# 웹 앱 서비스에 필요한 파일만 Pages에 배포한다. 개발 문서(docs, CLAUDE.md, src, tests, tools, android)는 배포하지 않는다.
# 준비 단계: 수동 실행(workflow_dispatch)만 켜 둔다. 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꾼 뒤
# 첫 수동 실행으로 확인하고, 그다음 아래 push 트리거를 켠다 (사용자 승인 후).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect service files
        run: |
          set -euo pipefail
          # 필요한 파일 (index.html·sw.js·manifest·TWA 설정에서 참조하는 것 전부)
          FILES="index.html privacy.html manifest.webmanifest sw.js
                 icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png icons/maskable-512.png
                 .well-known/assetlinks.json"
          rm -rf _site
          for f in $FILES; do mkdir -p "_site/$(dirname "$f")"; cp "$f" "_site/$f"; done
          # TWA 연결 파일이 원본과 똑같이 들어갔는지 확인 (빠지면 안드로이드 앱 위에 주소창이 생긴다)
          cmp .well-known/assetlinks.json _site/.well-known/assetlinks.json
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # 기본값은 점(.)으로 시작하는 폴더를 빼므로 .well-known을 넣으려면 반드시 true
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed files
        run: |
          set -euo pipefail
          BASE="https://imkorea2414.github.io"
          sleep 30
          curl -fsS "$BASE/.well-known/assetlinks.json" -o served.json
          python3 -c "import json,sys; a=json.load(open('served.json')); b=json.load(open('.well-known/assetlinks.json')); sys.exit(0 if a==b else 'assetlinks.json differs')"
          for p in / /index.html /privacy.html /manifest.webmanifest /sw.js /icons/icon-512.png /icons/maskable-512.png; do
            curl -fsS -o /dev/null -w "%{http_code} $p\n" "$BASE$p"
          done
          # 개발 문서는 배포되지 않아야 한다
          for p in /CLAUDE.md /src/template.html /docs/출시_계획.md; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$p" || true)
            echo "$code $p"; [ "$code" = "404" ] || { echo "::error::$p is still public"; exit 1; }
          done
