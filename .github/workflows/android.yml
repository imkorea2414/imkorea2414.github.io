name: Android app bundle

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 비밀값이 아직 없으면 서명 없이 빌드만 확인한다 (Play Console에는 올릴 수 없는 파일).
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.HAS_KEY == 'true'
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Warn when unsigned
        if: env.HAS_KEY != 'true'
        run: echo "::warning::KEYSTORE_BASE64 비밀값이 없어 서명되지 않은 파일을 만듭니다. Play Console에는 올릴 수 없습니다."

      - name: Build bundle and APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: upload
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: speedread-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
